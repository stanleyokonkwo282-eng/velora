version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    container_name: velora_postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_secure_password
      POSTGRES_DB: social_platform_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: velora_redis
    ports:
      - "6379:6379"
volumes:
  pgdata:
